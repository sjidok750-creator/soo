<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>스터디버디</title>
    <link rel="icon" type="image/svg+xml" href="/soo/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/soo/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/soo/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/soo/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="스터디버디" />
    <link rel="manifest" href="/soo/manifest.json" />
    <meta name="theme-color" content="#0D9488" />
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400&display=swap" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <script>
      // GitHub Pages SPA: 404.html에서 넘어온 경로 복원
      (function () {
        var p = window.location.search.slice(1).match(/p=([^&]+)/);
        if (p) {
          window.history.replaceState(null, null, '/' + decodeURIComponent(p[1]));
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
